name: PC (tests + programa Windows)

on:
  push:
    paths:
      - "desktop/**"
      - "COMANDOS.md"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
  workflow_dispatch:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar motor
        working-directory: desktop
        run: pip install -r requirements.txt

      - name: Tests (comandos + pegamento + servidor)
        working-directory: desktop
        run: |
          python tests/test_postprocess.py
          python tests/test_transcribe_glue.py
          python tests/test_server.py

      - name: Diagnóstico si falla
        if: failure()
        working-directory: desktop
        shell: python
        run: |
          import subprocess, sys
          for t in ["tests/test_postprocess.py", "tests/test_transcribe_glue.py", "tests/test_server.py"]:
              try:
                  p = subprocess.run([sys.executable, t], capture_output=True, text=True, timeout=150)
                  out = (p.stdout + "\n" + p.stderr)[-2500:]
              except Exception as e:
                  p = None
                  out = f"EXCEPCION: {e}"
              code = p.returncode if p else "?"
              esc = out.replace("\r", "").replace("\n", "%0A")
              print(f"::error title={t} exit={code}::{esc}")
          try:
              import faster_whisper
              print(f"::notice title=fw-import::OK {faster_whisper.__version__}")
          except Exception as e:
              print(f"::error title=fw-import::FAIL %0A{repr(e)}"[:1500])

  exe-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Construir Trasncriptor.exe
        working-directory: desktop
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller Trasncriptor.spec

      - name: Subir programa
        uses: actions/upload-artifact@v4
        with:
          name: Trasncriptor-windows
          path: desktop/dist/Trasncriptor
          retention-days: 30
