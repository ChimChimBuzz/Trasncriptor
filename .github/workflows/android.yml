name: Android (tests + APK)

on:
  push:
    paths:
      - "android/**"
      - "COMANDOS.md"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle 8.9
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Tests + APK debug
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Trasncriptor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
